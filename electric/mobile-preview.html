<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Warehouse — Mobile Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#10192e;color:#f8f8ff;font:700 14px 'Courier New',monospace}h1{color:#ffe082;text-align:center;text-shadow:3px 3px #000;margin:12px}h2{color:#ffe082;margin:0 0 10px}button,select,textarea{font:inherit}button{cursor:pointer;background:#ffe082;border:3px solid #121e34;color:#14243d;padding:10px;box-shadow:3px 3px #050d1c}button:disabled{opacity:.5}select,textarea{width:100%;background:#f5f8ff;border:3px solid #10192e;color:#18243b;padding:10px}textarea{height:220px;white-space:pre;resize:vertical}label{display:block;margin:12px 0 5px}.wrap{max-width:1050px;margin:auto;padding:12px}.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}.panel{border:3px solid #7bbaf3;background:#233958;padding:15px;box-shadow:5px 5px #050b17}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.muted{color:#bfd3ed;font-size:12px;line-height:1.6}.error{color:#ff91a4}.ok{color:#88ffc0}.hud{display:flex;flex-wrap:wrap;gap:15px;color:#ffe082;margin:10px 0}.stage{position:relative;border:4px solid #79baff;max-width:900px;margin:auto}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#14243e}.overlay{position:absolute;inset:0;background:#10192eea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:15px;text-align:center}.overlay[hidden],[hidden]{display:none!important}.notice{text-align:center;min-height:23px;color:#ffe082}.pad{display:none;grid-template-columns:repeat(3,60px);gap:5px;justify-content:center}.pad button{min-height:48px}.link{overflow-wrap:anywhere;color:#8cdaff}@media(max-width:700px){.cols{grid-template-columns:1fr}.pad{display:grid}textarea{height:170px}.wrap{padding:8px}}

/* Keep the full gameplay visible without vertical scrolling on school laptops. */
body:has(#game:not([hidden]))>h1{display:none}
body:has(#game:not([hidden])) .wrap{max-width:none;width:100%;padding:4px 8px;margin:0}
#game:not([hidden]){display:flex;flex-direction:column;align-items:center;gap:3px;height:calc(100dvh - 8px);min-height:0}
#game .hud{margin:0;min-height:18px;justify-content:center;font-size:clamp(10px,1vw,13px)}
#game .stage{width:min(100%,calc((100dvh - 116px)*900/610));max-width:900px;flex:0 1 auto;min-height:0}
#game .notice{margin:0;min-height:17px;font-size:12px}
#game>.row{margin:2px 0;gap:5px}
#game>.row button{padding:5px 8px;font-size:11px;box-shadow:none}
@media(max-height:700px){#game .stage{width:min(100%,calc((100dvh - 100px)*900/610))}#game>.row button{padding:3px 6px}}
body:has(#game:not([hidden]))>h1{display:none}body:has(#game:not([hidden])) .wrap{padding:2px;width:100%;max-width:none}#game:not([hidden]){display:flex;flex-direction:column;align-items:center;gap:2px;height:calc(100dvh - 4px)}#game .stage{width:min(100%,calc((100dvh - 112px)*600/900));max-width:600px;flex:0 1 auto;min-height:0}#game canvas{touch-action:none;user-select:none;-webkit-user-select:none}#game .hud{margin:0;min-height:17px;font-size:10px;justify-content:center}#game .notice{min-height:15px;margin:0;font-size:11px}#game>.row{margin:1px 0;gap:4px}#game>.row button{padding:5px;font-size:11px;box-shadow:none}#game .pad{display:none!important}</style><link rel="stylesheet" href="arcade.css"></head><body><h1>▣ WORD WAREHOUSE ▣</h1><main class="wrap"><p class="muted" style="text-align:center">PORTRAIT PROTOTYPE · DRAG TO MOVE · TAP TO PICK UP / DELIVER</p>
<section id="game" hidden><h2 class="arcade-title">VOCABULARY WAREHOUSE</h2>
 <div class="arcade-actions"><button id="pause">PAUSE</button><button id="restart">RESTART</button><button id="back">MAIN MENU</button><button id="sound" aria-pressed="true">SOUND ON</button></div><div id="hud" class="hud"></div><p id="wordPrompt" class="word-prompt"></p><div class="stage"><canvas id="canvas" width="600" height="900"></canvas><div id="overlay" class="overlay" hidden></div></div><p id="notice" class="notice"></p><div class="pad"><span></span><button data-key="arrowup">↑</button><span></span><button data-key="arrowleft">←</button><button id="pickup">SPACE</button><button data-key="arrowright">→</button><span></span><button data-key="arrowdown">↓</button><span></span></div></section></main>
<script src="electrical.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const zones=[{x:12,y:85},{x:226,y:85},{x:450,y:85},{x:450,y:290},{x:450,y:640},{x:226,y:640},{x:12,y:640},{x:12,y:290}];
const context=$('canvas').getContext('2d'),pressed=new Set(),touch={active:false,id:null,x:0,y:0,dx:0,dy:0,moved:false};
let active=null,frame=0,prev=0,speechToken=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>{let n=Math.floor(ms/100);return String(Math.floor(n/600)).padStart(2,'0')+':'+String(Math.floor(n/10)%60).padStart(2,'0')+'.'+n%10};
let soundOn=true;
let sessionListener, sessionSet, disposed=false;
function speak(word,lang){if(!soundOn||!word)return;if(sessionListener){sessionListener({type:'BT_WAREHOUSE_SPEAK',text:word});return;}if(!('speechSynthesis'in window)||!word)return;const token=++speechToken;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang=lang;u.rate=.9;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.split('-')[0]===lang.split('-')[0])||null;if(token===speechToken)speechSynthesis.speak(u)}catch{}}
function stopSpeech(){if(sessionListener){sessionListener({type:'BT_WAREHOUSE_CANCEL_SPEECH'});return;}speechToken++;try{speechSynthesis.cancel()}catch{}}
function announce(t){$('notice').textContent=t}
function stopGame(){if(frame)cancelAnimationFrame(frame);frame=0;pressed.clear();stopSpeech();active=null}
function start(set){stopGame();active={pairs:set.pairs.map(p=>[...p]),language:set.language,round:0,elapsed:0,roundTimes:[],mistakes:0,state:'running',x:448,y:489,carrying:false,facing:'down',walking:false,step:0};$('game').hidden=false;$('pause').textContent='PAUSE';$('pause').disabled=false;$('game').classList.remove('complete');$('overlay').hidden=true;newRound();prev=performance.now();frame=requestAnimationFrame(tick)}
function current(){return active?.roundPairs[active.order[active.index]]}
function sayCurrent(){const p=current();if(p&&!sessionListener)speak(p[1],active.language)}
function newRound(){const s=active;s.roundPairs=s.pairs.slice(s.round*8,s.round*8+8);s.order=shuffle(s.roundPairs.map((_,i)=>i));s.positions=shuffle(zones.map((_,i)=>i)).slice(0,s.roundPairs.length);s.connections=new Map();s.powering=null;s.index=0;s.roundStart=s.elapsed;s.carrying=false;announce('New round! Walk back to the centre for the next plug.')}
function next(){const s=active;s.index++;s.carrying=false;if(s.index===s.roundPairs.length){s.roundTimes.push(s.elapsed-s.roundStart);if((s.round+1)*8>=s.pairs.length){finish();return}s.round++;newRound()}else{announce('Correct! Walk back to the centre for the next plug.')}}
function delivery(i){const s=active;if(!s.carrying)return;if(i===s.order[s.index]){const pair=current();s.carrying=false;s.connections.set(i,s.elapsed);s.powering={until:s.elapsed+WarehouseElectrical.sparkDuration};speak(pair[0],s.language);announce('Powering the bulb…')}else{s.mistakes++;s.nopeUntil=s.elapsed+850;s.carrying=false;announce('NOPE! Wrong socket. Walk back to the centre.')}}
function pickup(){const s=active;if(!s||s.state!=='running'||s.carrying)return;if(Math.hypot(s.x-300,s.y-450)<160){s.carrying=true;sayCurrent();announce('Carry the plug to the matching socket')}else announce('Move closer to the central power box')}
function action(){const s=active;if(!s||s.state!=='running'||s.powering)return;if(!s.carrying){pickup();return;}let closest=-1,best=Infinity;for(let i=0;i<s.roundPairs.length;i++){const z=zones[s.positions[i]],cx=z.x+69,cy=z.y+36;const distance=Math.hypot(s.x-cx,s.y-cy);if(distance<best){best=distance;closest=i;}}if(closest>=0&&best<=125){delivery(closest);return;}announce('Move closer to a socket and press SPACE to deliver.');}
function pause(){const s=active;if(!s||s.state==='finished')return;if(s.state==='running'){s.state='paused';$('pause').textContent='RESUME';stopSpeech();if(frame)cancelAnimationFrame(frame);frame=0;const box=$('overlay');box.hidden=false;box.replaceChildren();const h=document.createElement('h2');h.textContent='PAUSED';box.append(h)}else{s.state='running';$('pause').textContent='PAUSE';$('overlay').hidden=true;prev=performance.now();frame=requestAnimationFrame(tick)}emitState()}
function finish(){
 const s=active;
 s.state='finished';
 $('pause').disabled=true;
 $('game').classList.add('complete');
 announce('');
 render();
 const box=$('overlay');
 const card=document.createElement('div');
 card.className='results-card';
 const heading=document.createElement('h2');
 heading.textContent='WAREHOUSE COMPLETE!';
 const total=document.createElement('p');
 total.textContent='Total '+fmt(s.elapsed)+' · Mistakes '+s.mistakes;
 card.append(heading,total);
 if(s.roundTimes.length>1){
  const rounds=document.createElement('p');
  rounds.textContent=s.roundTimes.map((t,i)=>'Round '+(i+1)+': '+fmt(t)).join(' | ');
  card.append(rounds);
 }
 box.replaceChildren(card);
 box.hidden=false;
 emitState();
}
const rect=(x,y,w,h,c)=>{context.fillStyle=c;context.fillRect(x,y,w,h)};
function drawText(t,x,y,color='#fff',size=16){context.fillStyle=color;context.font='bold '+size+'px monospace';context.textAlign='center';context.textBaseline='middle';context.fillText(t,x,y)}
function short(t,n=12){return [...t].length>n?[...t].slice(0,n-1).join('')+'…':t}
// Pixel-art Viking: 3px pixels, walking limbs, front/back/side views.
// Construction worker sprite adapted from Sentence Warehouse; cargo text stays screen-facing.
function drawViking(s){
 const c=context,phase=s.walking?Math.floor(s.step/90)%4:0,bob=s.walking?[0,2,0,-2][phase]:0;
 const back=s.facing==='up';
 c.save();c.translate(Math.round(s.x),Math.round(s.y)+bob);
 if(s.facing==='left')c.scale(-1,1);
 const px=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x*3,y*3,w*3,h*3)};
 c.fillStyle='#07122288';c.fillRect(-22,29,44,5);
 const stride=s.walking?[0,2,0,-2][phase]:0;
 px(-6+stride,7,5,4,'#17283a');px(2-stride,7,5,4,'#17283a');
 px(-6+stride,10,6,2,'#384e62');px(1-stride,10,6,2,'#384e62');
 px(-7,-6,14,14,'#192a39');px(-6,-5,12,12,'#ff981f');
 px(-2,-5,4,12,'#ffdd4d');px(-6,3,12,2,'#dce4e8');
 px(-7,5,14,2,'#243b52');
 px(-6,-17,12,12,'#1b2938');px(-5,-16,10,10,back?'#4b3227':'#d69a72');
 if(!back){px(-3,-13,2,2,'#162638');px(2,-13,2,2,'#162638');px(-1,-10,2,1,'#8b543b')}
 px(-7,-20,14,5,'#19293a');px(-6,-21,12,5,'#f2b919');px(-7,-18,14,2,'#ffd849');px(-4,-22,8,2,'#ffd849');
 if(s.carrying){
   px(-10,-15,3,12,'#ff981f');px(7,-15,3,12,'#ff981f');
   px(-10,-18,3,4,'#d69a72');px(7,-18,3,4,'#d69a72');
   c.restore();
   WarehouseElectrical.plug(c,Math.round(s.x),Math.round(s.y)+bob-96,String(current()?.[1]??''));
   return;
 }
 px(-10,-3,3,9,'#ff981f');px(7,-3,3,9,'#ff981f');
 px(-10,4,3,3,'#d69a72');px(7,4,3,3,'#d69a72');
 c.restore();
}
function render(){const s=active;if(!s)return;const prompt=s.state==='finished'?'ALL CONNECTED':current()?.[1]??'';if($('wordPrompt').textContent!==prompt)$('wordPrompt').textContent=prompt;rect(0,0,600,900,'#14253e');context.strokeStyle='#243b57';for(let x=0;x<600;x+=30){context.beginPath();context.moveTo(x,0);context.lineTo(x,900);context.stroke()}for(let y=0;y<900;y+=30){context.beginPath();context.moveTo(0,y);context.lineTo(600,y);context.stroke()}
WarehouseElectrical.draw(context,s,zones,{x:300,y:450},current()?.[1]);
drawViking(s);
if(s.nopeUntil>s.elapsed){context.save();context.fillStyle='#22070bdc';context.fillRect(150,380,300,110);context.strokeStyle='#ff465e';context.lineWidth=5;context.strokeRect(150,380,300,110);drawText('NOPE!',300,435,'#ff465e',57);context.restore();}
$('hud').textContent='ROUND '+(s.round+1)+'/'+Math.ceil(s.pairs.length/8)+' · WORDS '+(s.round*8+s.index)+'/'+s.pairs.length+' · TOTAL '+fmt(s.elapsed)+' · ROUND '+fmt(s.elapsed-s.roundStart)+' · MISTAKES '+s.mistakes}
function tick(now){frame=0;const s=active;if(!s||s.state!=='running')return;const dt=Math.min(80,Math.max(0,now-prev));prev=now;s.elapsed+=dt;if(s.powering&&s.elapsed>=s.powering.until){if(s.index===s.roundPairs.length-1&&s.elapsed<s.powering.until+180){render();frame=requestAnimationFrame(tick);return;}s.powering=null;next();if(s.state!=='running')return;}let dx=(pressed.has('arrowright')||pressed.has('d')?1:0)-(pressed.has('arrowleft')||pressed.has('a')?1:0),dy=(pressed.has('arrowdown')||pressed.has('s')?1:0)-(pressed.has('arrowup')||pressed.has('w')?1:0);if(touch.active){dx=touch.dx;dy=touch.dy;}if(dx||dy){s.walking=true;s.step=(s.step||0)+dt;if(Math.abs(dx)>Math.abs(dy))s.facing=dx>0?'right':'left';else s.facing=dy>0?'down':'up'}else{s.walking=false}s.step=s.step||0;const l=Math.hypot(dx,dy)||1;s.x=Math.max(25,Math.min(575,s.x+dx/l*(touch.active?440:270)*dt/1000));s.y=Math.max(45,Math.min(845,s.y+dy/l*(touch.active?440:270)*dt/1000));render();if(active?.state==='running')frame=requestAnimationFrame(tick)}
const stageCanvas=$('canvas');stageCanvas.addEventListener('pointerdown',e=>{if($('game').hidden||active?.state!=='running'||touch.active)return;e.preventDefault();stageCanvas.setPointerCapture(e.pointerId);Object.assign(touch,{active:true,id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false});});stageCanvas.addEventListener('pointermove',e=>{if(!touch.active||e.pointerId!==touch.id)return;e.preventDefault();const dx=e.clientX-touch.x,dy=e.clientY-touch.y,len=Math.hypot(dx,dy);if(len>12)touch.moved=true;touch.dx=len>12?dx/Math.max(45,len):0;touch.dy=len>12?dy/Math.max(45,len):0;});function releaseTouch(e){if(!touch.active||e.pointerId!==touch.id)return;const tap=!touch.moved&&e.type==='pointerup';touch.active=false;touch.id=null;touch.dx=touch.dy=0;if(tap)action();}stageCanvas.addEventListener('pointerup',releaseTouch);stageCanvas.addEventListener('pointercancel',releaseTouch);window.addEventListener('keydown',e=>{if($('game').hidden||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();pressed.add(k);if(k===' '&&!e.repeat)action();if(k==='p'&&!e.repeat)pause()});window.addEventListener('keyup',e=>pressed.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{pressed.clear();if(active?.state==='running')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active?.state==='running')pause()});
for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(b.dataset.key);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>pressed.delete(b.dataset.key))}
function state(){
 return {status:disposed?'disposed':active?.state==='finished'?'ended':active?.state??'paused',
   soundOn, score:active?active.round*8+active.index:0,
   lives:0, round:active?active.round+1:0, done:active?active.round*8+active.index:0};
}
function emitState(){sessionListener?.({type:'BT_WAREHOUSE_STATE',...state()});}
function setSound(value){
 if(typeof value!=='boolean')return false;
 soundOn=value;
 if(!soundOn)stopSpeech();
 $('sound').textContent=soundOn?'SOUND ON':'SOUND OFF';
 $('sound').setAttribute('aria-pressed',String(soundOn));
 return true;
}
function validateSet(pairs,language){
 return ['en-US','es-ES','de-DE','da-DK','fr-FR','it-IT'].includes(language)&&
   Array.isArray(pairs)&&pairs.length>=5&&pairs.length<=500&&
   pairs.every(pair=>Array.isArray(pair)&&pair.length===2&&pair.every(word=>typeof word==='string'&&word.trim()));
}
function adaptSet(pairs,language){return {pairs:pairs.map(([prompt,target])=>[target.trim(),prompt.trim()]),language};}
window.BTWarehouse={
 subscribe(listener){if(sessionListener)return false;sessionListener=listener;return true;},
 setShellManaged(value){document.body.classList.toggle('shell-managed',value);return true;},
 initialize(set){
  if(!validateSet(set.pairs,set.language))return false;
  sessionSet=adaptSet(set.pairs,set.language);
  start(sessionSet);
  pause();
  render();
  return true;
 },
 resume(){if(!active||active.state==='finished')return false;if(active.state==='paused')pause();return true;},
 pause(){if(!active)return false;if(active.state==='running')pause();return true;},
 restart(){if(!sessionSet)return false;start(sessionSet);return true;},
 setSound,
 resize(){if(active)render();},
 state,
 dispose(){disposed=true;stopGame();sessionListener=null;}
};
$('sound').onclick=()=>setSound(!soundOn);
$('pickup').onclick=action;
$('pause').onclick=pause;
$('restart').onclick=()=>{if(active)start(active)};
$('back').onclick=()=>parent.postMessage({type:'BT_WAREHOUSE_MENU'},location.origin);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent||sessionListener||disposed)return;
 if(event.data?.type==='BT_WAREHOUSE_PING')parent.postMessage({type:'BT_WAREHOUSE_READY'},location.origin);
 if(event.data?.type==='BT_WAREHOUSE_START'){
  const set=event.data.set;
  if(!validateSet(set?.pairs,set?.language)){
   parent.postMessage({type:'BT_WAREHOUSE_START_FAILED'},location.origin);
   return;
  }
  start(adaptSet(set.pairs,set.language));
  parent.postMessage({type:'BT_WAREHOUSE_STARTED'},location.origin);
 }
});
if(parent!==window)parent.postMessage({type:'BT_WAREHOUSE_READY'},location.origin);
</script><script type="module" src="bootstrap.mjs"></script></body></html>
